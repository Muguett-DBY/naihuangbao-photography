name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm --version
      - run: npm ci
      - run: npm run db:migrate:check
      - run: npm run cf:types:check
      - run: npm run lint
      - run: npm test
      # S3·T4：法学内容残留扫描（基线棘轮，防内容回潮；超 scripts/law-scan-baseline.json 即红）
      - run: npm run law:scan
      - run: npm run build:full
      - run: npm run deps:audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
